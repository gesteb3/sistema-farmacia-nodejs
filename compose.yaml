services:
  postgres:
    image: postgres:17-alpine
    container_name: farmacia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmacia
      POSTGRES_USER: farmacia
      POSTGRES_PASSWORD: farmacia_dev
    ports:
      - '5433:5432'
    volumes:
      - farmacia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farmacia -d farmacia']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farmacia_postgres_data:
